name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh Wowza stream host and health flags once daily (05:17 PST / 06:17 PDT).
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Refresh camera index and build HTML
        run: |
          if ! python3 scripts/fetch_cameras.py; then
            echo "::warning::Live SDOT fetch failed; building from checked-in data/cameras.json"
          fi
          python3 scripts/generate_html.py
          mkdir -p _site
          cp index.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
